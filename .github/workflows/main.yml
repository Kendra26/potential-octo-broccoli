name: Torrent Download & Upload to Filemirage

on:
  push:
    branches:
      - Neew
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      FILEMIRAGE_API_TOKEN: '9QQH-DGES-CWQZ-FXNV'
      FOLDER_PATH: 'downloaded_files'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install qbittorrent-nox jq curl zip python3 python3-requests -y
          curl -o page.txt "https://equestria-eta.vercel.app/api/pages/dprjjMvC8fCF/raw"

      - name: Download torrent content with qBittorrent
        run: |
          mkdir -p "$FOLDER_PATH"
          
          # Pre-configure qBittorrent to bypass legal terms and localhost authentication
          mkdir -p ~/.config/qBittorrent
          cat << 'EOF' > ~/.config/qBittorrent/qBittorrent.conf
          [LegalNotice]
          Accepted=true

          [Preferences]
          WebUI\Port=8080
          WebUI\LocalHostAuth=false
          WebUI\AuthSubnetWhitelist=127.0.0.1/32
          WebUI\AuthSubnetWhitelistEnabled=true
          EOF

          # Start qbittorrent daemon in background
          qbittorrent-nox -d
          sleep 5

          # Add magnet links via Web API
          while IFS= read -r link || [ -n "$link" ]; do
            link=$(echo "$link" | tr -d '\r')
            if [ -n "$link" ] && [[ ! "$link" =~ ^# ]]; then
              echo "Adding to qBittorrent: $link"
              curl -s -X POST \
                -F "urls=$link" \
                -F "savepath=$PWD/$FOLDER_PATH" \
                http://127.0.0.1:8080/api/v2/torrents/add
            fi
          done < page.txt

          echo "Waiting for all torrents to finish downloading..."
          
          # Monitoring loop via Web API
          while true; do
            sleep 10
            
            RESPONSE=$(curl -s http://127.0.0.1:8080/api/v2/torrents/info)
            
            TOTAL=$(echo "$RESPONSE" | jq '. | length' 2>/dev/null || echo "0")
            INCOMPLETE=$(echo "$RESPONSE" | jq '[.[] | select(.progress < 1)] | length' 2>/dev/null || echo "0")
            
            if [ "$TOTAL" -eq 0 ]; then
              echo "No active torrents found."
              break
            fi

            echo "--> Total torrents: $TOTAL | Incomplete: $INCOMPLETE"
            
            if [ "$INCOMPLETE" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
              echo "All downloads completed!"
              break
            fi
          done

          # Stop qbittorrent daemon
          pkill qbittorrent-nox || true
          sleep 2

      - name: Smart Zip Conditions & Upload to Filemirage
        run: |
          python3 - << 'EOF'
          import os
          import re
          import sys
          import shutil
          import zipfile
          import subprocess
          import requests

          download_dir = os.path.abspath(os.environ.get("FOLDER_PATH", "downloaded_files"))
          FILEMIRAGE_TOKEN = os.environ.get("FILEMIRAGE_API_TOKEN", "")

          def zip_directory(dir_path, zip_output_path):
              with zipfile.ZipFile(zip_output_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
                  for root, _, files in os.walk(dir_path):
                      for file in files:
                          full_path = os.path.join(root, file)
                          arcname = os.path.relpath(full_path, dir_path)
                          zipf.write(full_path, arcname)

          def zip_files(file_paths, zip_output_path):
              with zipfile.ZipFile(zip_output_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
                  for fpath in file_paths:
                      zipf.write(fpath, os.path.basename(fpath))

          def get_concise_zip_name(show_titles, target_dir, max_len=55):
              clean_titles = []
              for t in show_titles:
                  c = re.sub(r'[^a-zA-Z0-9]+', '_', t).strip('_')
                  if c and c not in clean_titles:
                      clean_titles.append(c)
              
              combined = "_".join(clean_titles)
              if len(combined) > max_len:
                  if len(clean_titles) > 1:
                      combined = f"{clean_titles[0][:25]}_and_{len(clean_titles)-1}_more"
                  else:
                      combined = clean_titles[0][:max_len]
              if not combined:
                  combined = "bundle"
              return os.path.join(target_dir, f"{combined}.zip")

          def upload_with_curl(server_url, token, file_path):
              file_name = os.path.basename(file_path)
              upload_endpoint = f"{server_url.rstrip('/')}/upload.php"
              
              cmd = [
                  "curl", "-s", "-S",
                  "--connect-timeout", "30",
                  "-H", f"Authorization: Bearer {token}",
                  "-F", f"file=@{file_path};filename={file_name}",
                  upload_endpoint
              ]
              
              res = subprocess.run(cmd, capture_output=True, text=True)
              if res.returncode == 0 and '"success":true' in res.stdout.lower():
                  print(f" -> Uploaded: {file_name}")
                  return True
              else:
                  print(f" -> Failed: {file_name} | Response: {res.stdout} | Error: {res.stderr}")
                  return False

          final_upload_files = []

          # Step A: Check subdirectories for > 5 files
          for item in os.listdir(download_dir):
              full_path = os.path.join(download_dir, item)
              if os.path.isdir(full_path):
                  dir_files = [os.path.join(r, f) for r, _, fs in os.walk(full_path) for f in fs]
                  if len(dir_files) > 5:
                      zip_name = os.path.join(download_dir, f"{item}.zip")
                      print(f"Subfolder '{item}' has {len(dir_files)} files (>5). Zipping into '{item}.zip'...")
                      zip_directory(full_path, zip_name)
                      final_upload_files.append(zip_name)
                      shutil.rmtree(full_path)

          # Step B: Scan remaining files
          remaining_files = []
          for root, _, files in os.walk(download_dir):
              for f in files:
                  fpath = os.path.join(root, f)
                  if fpath not in final_upload_files:
                      remaining_files.append(fpath)

          # Step C: Detect series patterns
          series_regex = re.compile(r'^(.*?)[._\s-]+(?:[sS]\d+|\d+[xX]\d+|season\s*\d+|ep?\d+)', re.IGNORECASE)
          series_groups = {}
          non_series_files = []

          for fpath in remaining_files:
              fname = os.path.basename(fpath)
              match = series_regex.match(fname)
              if match:
                  show_title = re.sub(r'[._-]+', ' ', match.group(1)).strip().lower()
                  if show_title not in series_groups:
                      series_groups[show_title] = []
                  series_groups[show_title].append(fpath)
              else:
                  non_series_files.append(fpath)

          # Step D: Process Series groups
          small_series_files = []
          small_series_titles = []

          for show_title, files in series_groups.items():
              if len(files) > 3:
                  files.sort()
                  zip_name = get_concise_zip_name([show_title], download_dir)
                  print(f"Series '{show_title}' has {len(files)} files (>3). Zipping into '{os.path.basename(zip_name)}'...")
                  zip_files(files, zip_name)
                  final_upload_files.append(zip_name)
                  for f in files:
                      if os.path.exists(f): os.remove(f)
              else:
                  print(f"Series '{show_title}' has {len(files)} file(s) (<=3). Collecting for potential zip bundle...")
                  small_series_files.extend(files)
                  small_series_titles.append(show_title)

          if len(small_series_files) >= 3:
              bundle_zip_name = get_concise_zip_name(small_series_titles, download_dir)
              print(f"Zipping {len(small_series_files)} small series file(s) (>=3 total) together into '{os.path.basename(bundle_zip_name)}'...")
              zip_files(small_series_files, bundle_zip_name)
              final_upload_files.append(bundle_zip_name)
              for f in small_series_files:
                  if os.path.exists(f): os.remove(f)
          elif small_series_files:
              print(f"Only {len(small_series_files)} small series file(s) (<3 total). Skipping zip, uploading as unzipped files.")
              final_upload_files.extend(small_series_files)

          final_upload_files.extend(non_series_files)

          # Fetch Filemirage server and upload
          print("\nFetching Filemirage server...")
          try:
              srv_resp = requests.get("https://filemirage.com/api/servers", timeout=15).json()
              server = srv_resp.get("data", {}).get("server")
          except Exception as e:
              print(f"Error connecting to Filemirage API: {e}")
              sys.exit(1)

          if not server:
              print("Failed to get valid Filemirage server.")
              sys.exit(1)

          print(f"\nUploading {len(final_upload_files)} item(s) to Filemirage server ({server})...")

          has_failed = False
          for file_path in final_upload_files:
              if not os.path.isfile(file_path):
                  continue
              
              success = upload_with_curl(server, FILEMIRAGE_TOKEN, file_path)
              if not success:
                  has_failed = True

          if has_failed:
              sys.exit(1)
          EOF
